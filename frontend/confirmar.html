<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicOS | Confirmación de cita</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: white;
    border-radius: 16px;
    padding: 28px 28px 32px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .lang-switcher {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
    position: relative;
  }
  .lang-btn {
    border: 1px solid #e2e8f0;
    background: white;
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    cursor: pointer;
    color: #64748b;
    animation: flotar 2.6s ease-in-out infinite;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .lang-btn[data-lang="es"] { animation-delay: 0s; }
  .lang-btn[data-lang="en"] { animation-delay: 0.3s; }
  .lang-btn[data-lang="fr"] { animation-delay: 0.6s; }
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .lang-btn.activo {
    background: #3b82f6;
    color: white;
    border-color: #3b82f6;
    font-weight: bold;
  }
  .flecha-hint {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 16px;
  }
  .flecha-arriba {
    display: inline-block;
    animation: rebotar 1.2s ease-in-out infinite;
  }
  @keyframes rebotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .icono { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 20px; color: #1e293b; margin: 0 0 12px; }
  p { font-size: 14px; color: #64748b; margin: 0; line-height: 1.5; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: #3b82f6;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  .btn-reprogramar {
    display: inline-block;
    margin-top: 18px;
    background: #3b82f6;
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    padding: 12px 22px;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lang-switcher" id="langSwitcher">
      <button class="lang-btn" data-lang="es" onclick="cambiarIdioma('es')">🇪🇸 ES</button>
      <button class="lang-btn" data-lang="en" onclick="cambiarIdioma('en')">🇺🇸 EN</button>
      <button class="lang-btn" data-lang="fr" onclick="cambiarIdioma('fr')">🇫🇷 FR</button>
    </div>
    <div class="flecha-hint"><span class="flecha-arriba">👆</span> Elige tu idioma / Choose your language / Choisissez votre langue</div>
    <div id="contenido">
      <div class="spinner"></div>
      <h1 id="tituloTexto">Procesando...</h1>
      <p id="mensajeTexto">Un momento por favor.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://klaygjvawybfksmahbhd.supabase.co";

    const TXT = {
      es: {
        procesando_titulo: "Procesando...",
        procesando_mensaje: "Un momento por favor.",
        confirmada_titulo: "¡Cita confirmada!",
        confirmada_mensaje: "Gracias por confirmar tu asistencia. Te esperamos en la fecha y hora programada.",
        reprogramar_titulo: "Cita liberada",
        reprogramar_mensaje: "Tu horario quedó liberado. Cuando quieras, elige uno nuevo:",
        reprogramar_btn: "🗓️ Elegir nuevo horario",
        ya_inactiva_titulo: "Esta cita ya no está activa",
        ya_inactiva_mensaje: "Esta cita ya fue cancelada o marcada como completada anteriormente.",
        no_encontrada_titulo: "Cita no encontrada",
        no_encontrada_mensaje: "No pudimos encontrar esta cita. Puede que ya haya sido modificada.",
        invalido_titulo: "Enlace inválido",
        invalido_mensaje: "Este enlace no es válido, está incompleto o ya fue utilizado incorrectamente.",
        config_titulo: "Error de configuración",
        config_mensaje: "El sistema no está configurado correctamente. Contacta a la clínica.",
        error_titulo: "Error inesperado",
        error_mensaje: "Ocurrió un error. Por favor contacta a la clínica directamente.",
        conexion_titulo: "Error de conexión",
        conexion_mensaje: "No pudimos comunicarnos con el servidor. Verifica tu conexión a internet e intenta de nuevo, o contacta directamente a la clínica.",
      },
      en: {
        procesando_titulo: "Processing...",
        procesando_mensaje: "One moment please.",
        confirmada_titulo: "Appointment confirmed!",
        confirmada_mensaje: "Thank you for confirming your attendance. We'll see you at the scheduled date and time.",
        reprogramar_titulo: "Appointment released",
        reprogramar_mensaje: "Your time slot has been freed up. Whenever you're ready, choose a new one:",
        reprogramar_btn: "🗓️ Choose new time",
        ya_inactiva_titulo: "This appointment is no longer active",
        ya_inactiva_mensaje: "This appointment was already cancelled or marked as completed previously.",
        no_encontrada_titulo: "Appointment not found",
        no_encontrada_mensaje: "We couldn't find this appointment. It may have already been modified.",
        invalido_titulo: "Invalid link",
        invalido_mensaje: "This link is invalid, incomplete, or was already used incorrectly.",
        config_titulo: "Configuration error",
        config_mensaje: "The system isn't configured correctly. Please contact the clinic.",
        error_titulo: "Unexpected error",
        error_mensaje: "Something went wrong. Please contact the clinic directly.",
        conexion_titulo: "Connection error",
        conexion_mensaje: "We couldn't reach the server. Check your internet connection and try again, or contact the clinic directly.",
      },
      fr: {
        procesando_titulo: "Traitement en cours...",
        procesando_mensaje: "Un instant s'il vous plaît.",
        confirmada_titulo: "Rendez-vous confirmé !",
        confirmada_mensaje: "Merci d'avoir confirmé votre présence. Nous vous attendons à la date et à l'heure prévues.",
        reprogramar_titulo: "Rendez-vous libéré",
        reprogramar_mensaje: "Votre créneau a été libéré. Quand vous voulez, choisissez-en un nouveau :",
        reprogramar_btn: "🗓️ Choisir un nouvel horaire",
        ya_inactiva_titulo: "Ce rendez-vous n'est plus actif",
        ya_inactiva_mensaje: "Ce rendez-vous a déjà été annulé ou marqué comme terminé auparavant.",
        no_encontrada_titulo: "Rendez-vous introuvable",
        no_encontrada_mensaje: "Nous n'avons pas pu trouver ce rendez-vous. Il a peut-être déjà été modifié.",
        invalido_titulo: "Lien invalide",
        invalido_mensaje: "Ce lien est invalide, incomplet ou a déjà été utilisé de façon incorrecte.",
        config_titulo: "Erreur de configuration",
        config_mensaje: "Le système n'est pas configuré correctement. Veuillez contacter la clinique.",
        error_titulo: "Erreur inattendue",
        error_mensaje: "Une erreur s'est produite. Veuillez contacter directement la clinique.",
        conexion_titulo: "Erreur de connexion",
        conexion_mensaje: "Nous n'avons pas pu contacter le serveur. Vérifiez votre connexion internet et réessayez, ou contactez directement la clinique.",
      },
    };

    let idiomaActual = "es";
    let ultimoEstado = null;

    function idiomaValido(l) {
      return ["es", "en", "fr"].includes(l) ? l : "es";
    }

    function marcarBotonActivo() {
      document.querySelectorAll("#langSwitcher .lang-btn").forEach(btn => {
        btn.classList.toggle("activo", btn.dataset.lang === idiomaActual);
      });
    }

    function pintar() {
      const tx = TXT[idiomaActual];
      const contenido = document.getElementById("contenido");

      if (!ultimoEstado) {
        contenido.innerHTML = `
          <div class="spinner"></div>
          <h1>${tx.procesando_titulo}</h1>
          <p>${tx.procesando_mensaje}</p>
        `;
        return;
      }

      const codigo = ultimoEstado.codigo || "error";
      const icono = ultimoEstado.exito ? (codigo === "reprogramar" ? "🔄" : "✅") : "⚠️";
      const clave = TXT[idiomaActual][`${codigo}_titulo`] ? codigo : "error";

      let botonExtra = "";
      if (codigo === "reprogramar" && ultimoEstado.clinica_id) {
        const urlPublica = `https://softwareclinicoavanzado.github.io/software-clinico-v1/frontend/agendar-publico.html?clinica=${ultimoEstado.clinica_id}&lang=${idiomaActual}`;
        botonExtra = `<a class="btn-reprogramar" href="${urlPublica}">${tx.reprogramar_btn}</a>`;
      }

      contenido.innerHTML = `
        <div class="icono">${icono}</div>
        <h1>${tx[`${clave}_titulo`]}</h1>
        <p>${tx[`${clave}_mensaje`]}</p>
        ${botonExtra}
      `;
    }

    function cambiarIdioma(lang) {
      idiomaActual = idiomaValido(lang);
      marcarBotonActivo();
      pintar();
    }

    async function procesar() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const accion = params.get("accion");
      const token = params.get("token");
      const langInicial = params.get("lang");

      idiomaActual = idiomaValido(langInicial || "es");
      marcarBotonActivo();
      pintar();

      if (!id || !accion || !token) {
        ultimoEstado = { exito: false, codigo: "invalido" };
        pintar();
        return;
      }

      try {
        const res = await fetch(
          `${SUPABASE_URL}/functions/v1/confirmar-cita?id=${encodeURIComponent(id)}&accion=${encodeURIComponent(accion)}&token=${encodeURIComponent(token)}`
        );
        const data = await res.json();
        ultimoEstado = { exito: !!data.exito, codigo: data.codigo || "error", clinica_id: data.clinica_id || null };
        pintar();
      } catch (e) {
        ultimoEstado = { exito: false, codigo: "conexion" };
        pintar();
      }
    }

    procesar();
  </script>
</body>
</html>
