<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicOS | Prueba gratis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: #ffffff;
    border-radius: 18px;
    padding: 34px 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg,#3b82f6,#8b5cf6);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; color: #1e293b; text-align: center; margin: 0 0 4px; }
  .subtitulo { font-size: 13px; color: #64748b; text-align: center; margin: 0 0 24px; }
  label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    font-size: 14px;
    margin-bottom: 16px;
    color: #1e293b;
  }
  input:focus, select:focus { outline: none; border-color: #3b82f6; background: white; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#3b82f6,#8b5cf6);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .nota-sin-tarjeta {
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    margin-top: 14px;
  }
  #vistaExito { display: none; text-align: center; }
  #vistaExito .icono { font-size: 48px; margin-bottom: 10px; }
  #vistaExito h2 { font-size: 19px; color: #1e293b; margin: 0 0 10px; }
  #vistaExito p { font-size: 14px; color: #64748b; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div id="vistaFormulario">
      <div class="logo-row">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <strong style="font-size:18px; color:#1e293b;">ClinicOS</strong>
      </div>
      <h1>Empieza tu prueba gratis</h1>
      <p class="subtitulo">14 días completos, sin pedir tarjeta.</p>

      <label>Nombre de la clínica</label>
      <input type="text" id="regNombreClinica" placeholder="Ej. Clínica San José">

      <label>Tu nombre</label>
      <input type="text" id="regAdminNombre" placeholder="Ej. Dra. María Pérez">

      <label>Tu correo electrónico</label>
      <input type="email" id="regAdminEmail" placeholder="tu@correo.com">

      <label>País</label>
      <select id="regPais"></select>

      <button type="button" id="btnRegistrar" onclick="enviarRegistro()">🚀 Empezar prueba gratis</button>

      <p class="nota-sin-tarjeta">Sin compromiso. No se te va a cobrar nada durante la prueba.</p>
    </div>

    <div id="vistaExito">
      <div class="icono">📬</div>
      <h2>¡Ya casi! Revisa tu correo</h2>
      <p>Te mandamos un correo para que pongas tu contraseña y entres a tu cuenta. Si no lo ves, revisa spam.</p>
    </div>
  </div>

  <script>
    const PAISES = [
      "Guatemala", "El Salvador", "Honduras", "Nicaragua", "Costa Rica", "Panamá",
      "México", "Colombia", "Argentina", "Chile", "Perú", "Uruguay",
      "España", "Estados Unidos", "Canadá", "Francia", "Brasil"
    ];

    function poblarPaises() {
      const sel = document.getElementById("regPais");
      sel.innerHTML = "";
      PAISES.forEach(p => {
        const op = document.createElement("option");
        op.value = p;
        op.textContent = p;
        sel.appendChild(op);
      });
    }

    async function enviarRegistro() {
      const nombre_clinica = document.getElementById("regNombreClinica").value.trim();
      const admin_nombre = document.getElementById("regAdminNombre").value.trim();
      const admin_email = document.getElementById("regAdminEmail").value.trim();
      const pais = document.getElementById("regPais").value;

      if (!nombre_clinica || !admin_nombre || !admin_email) {
        alert("Completa todos los campos para continuar.");
        return;
      }

      const btn = document.getElementById("btnRegistrar");
      btn.disabled = true;
      btn.innerText = "Creando tu cuenta...";

      try {
        const res = await fetch("https://klaygjvawybfksmahbhd.supabase.co/functions/v1/registrar-clinica-prueba", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre_clinica, admin_nombre, admin_email, pais }),
        });
        const data = await res.json();
        if (!res.ok || !data.exito) throw new Error(data.error || "Error desconocido");

        document.getElementById("vistaFormulario").style.display = "none";
        document.getElementById("vistaExito").style.display = "block";
      } catch (e) {
        console.error("Error al registrar clínica:", e);
        alert("Ocurrió un error al crear tu cuenta. Intenta de nuevo.");
        btn.disabled = false;
        btn.innerText = "🚀 Empezar prueba gratis";
      }
    }

    document.addEventListener("DOMContentLoaded", poblarPaises);
  </script>
</body>
</html>
