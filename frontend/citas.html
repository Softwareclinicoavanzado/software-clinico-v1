<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ClinicOS | Citas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ---------- Agenda ordenada ---------- */
    .ag-resumen { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .ag-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: #94a3b8; background: rgba(148,163,184,.08); border: 1px solid rgba(148,163,184,.18); }
    .ag-pill b { color: #e2e8f0; font-size: 14px; }
    .ag-pill.is-hoy { color: #bfdbfe; background: rgba(59,130,246,.14); border-color: rgba(59,130,246,.35); }
    .ag-pill.is-hoy b { color: #fff; }

    .ag-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .ag-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(148,163,184,.08); border: 1px solid rgba(148,163,184,.16); }
    .ag-tabs .ag-tab { width: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 0; border-radius: 9px; background: transparent; color: #94a3b8; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: none; transform: none; }
    .ag-tabs .ag-tab:hover { color: #e2e8f0; background: rgba(148,163,184,.1); }
    .ag-tabs .ag-tab.active { background: rgba(59,130,246,.18); color: #93c5fd; }
    .ag-count { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: rgba(148,163,184,.18); color: #cbd5e1; }
    .ag-tab.active .ag-count { background: rgba(59,130,246,.3); color: #bfdbfe; }
    .ag-filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .ag-filters .ag-search, .ag-filters .ag-select { width: auto; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(148,163,184,.22); background: rgba(15,23,42,.6); color: #e2e8f0; font-size: 14px; margin: 0; }
    .ag-filters .ag-search { min-width: 230px; }

    .ag-day { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(148,163,184,.14); }
    .ag-day h3 { margin: 0; font-size: 15px; font-weight: 700; color: #e2e8f0; }
    .ag-day.is-hoy h3 { color: #93c5fd; }
    .ag-day span { font-size: 12.5px; color: #7d8ca6; }
    .ag-day .ag-day-count { margin-left: auto; padding: 1px 8px; border-radius: 999px; background: rgba(148,163,184,.14); color: #cbd5e1; }

    .ag-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; margin-bottom: 10px; border-radius: 14px; border: 1px solid rgba(148,163,184,.16); background: rgba(15,23,42,.55); }
    .ag-row:hover { border-color: rgba(96,165,250,.35); }
    .ag-row.is-cancelada { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.05); }
    .ag-row.is-completada { opacity: .92; }
    .ag-time strong { display: block; font-size: 16px; color: #f1f5f9; }
    .ag-time span { display: block; margin-top: 2px; font-size: 12px; color: #7d8ca6; }
    .ag-who { display: flex; align-items: center; gap: 10px; }
    .ag-avatar { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 1px solid; font-size: 12px; font-weight: 700; }
    .ag-name { font-size: 15.5px; font-weight: 700; color: #f1f5f9; }
    .ag-alerta:not(:empty) { margin-top: 8px; }
    .ag-motivo { margin-top: 6px; font-size: 13.5px; color: #94a3b8; }
    .ag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ag-chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
    .ag-chip-green { background: rgba(34,197,94,.15); color: #22c55e; border-color: rgba(34,197,94,.3); }
    .ag-chip-red { background: rgba(239,68,68,.16); color: #f87171; border-color: rgba(239,68,68,.35); }
    .ag-chip-amber { background: rgba(245,158,11,.15); color: #f59e0b; border-color: rgba(245,158,11,.35); }
    .ag-chip-gray { background: rgba(148,163,184,.14); color: #94a3b8; border-color: rgba(148,163,184,.3); }
    .ag-chip-indigo { background: rgba(99,102,241,.15); color: #a5b4fc; border-color: rgba(99,102,241,.35); }
    .ag-chip-violet { background: rgba(139,92,246,.15); color: #c4b5fd; border-color: rgba(139,92,246,.35); }
    .ag-chip-wa { background: rgba(37,211,102,.14); color: #25d366; border-color: rgba(37,211,102,.35); }

    .ag-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
    .ag-btn { width: auto; margin: 0; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(148,163,184,.25); background: rgba(148,163,184,.08); color: #cbd5e1; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: none; transform: none; }
    .ag-btn svg { width: 15px; height: 15px; flex: none; }
    .ag-btn:hover { background: rgba(148,163,184,.16); color: #fff; }
    .ag-btn.ag-btn-wa { color: #25d366; border-color: rgba(37,211,102,.35); background: rgba(37,211,102,.1); }
    .ag-btn.ag-btn-ok { color: #22c55e; border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.1); }
    .ag-btn.ag-btn-no { color: #ef4444; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.1); }
    .ag-btn.ag-btn-pay { color: #f59e0b; border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.1); }
    .ag-btn.ag-btn-danger { color: #f87171; border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.08); }
    .ag-more { position: relative; }
    .ag-more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(148,163,184,.25); background: rgba(148,163,184,.08); color: #cbd5e1; font-size: 18px; line-height: 1; }
    .ag-more > summary::-webkit-details-marker { display: none; }
    .ag-more > summary:hover { background: rgba(148,163,184,.16); color: #fff; }
    .ag-menu { position: absolute; right: 0; top: 40px; z-index: 20; min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 6px; border-radius: 12px; border: 1px solid rgba(148,163,184,.22); background: #0e1626; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
    .ag-menu .ag-btn { width: 100%; justify-content: flex-start; }

    .ag-aviso { margin-bottom: 4px; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #fbbf24; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35); }
    .ag-empty { padding: 36px 16px; text-align: center; color: #7d8ca6; font-size: 14px; border: 1px dashed rgba(148,163,184,.25); border-radius: 14px; margin-top: 18px; }
    .ag-mas { text-align: center; margin-top: 6px; }

    @media (max-width: 760px) {
      .ag-row { grid-template-columns: 1fr; gap: 10px; }
      .ag-time { display: flex; align-items: baseline; gap: 8px; }
      .ag-time span { margin-top: 0; }
      .ag-actions { justify-content: flex-start; }
      .ag-filters .ag-search { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- El menú lo dibuja js/layout.js (igual en todas las páginas) -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-area">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:14px;">
          <button class="hamburger-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title">
            <span id="tituloPagina" data-i18n="gestion_citas">Gestión de Citas</span>
          </div>
        </div>

        <div class="lang-switcher">
          <button class="lang-btn" type="button" id="langMainBtn" onclick="toggleLangDropdown()">
            <span class="lang-flag-current" id="langFlagActual">🇲🇽</span>
            <span id="langBtnTexto">ES</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="es" onclick="seleccionarIdioma('es')"><span class="flag">🇲🇽</span> Español</button>
            <button class="lang-option" data-lang="en" onclick="seleccionarIdioma('en')"><span class="flag">🇺🇸</span> English</button>
            <button class="lang-option" data-lang="fr" onclick="seleccionarIdioma('fr')"><span class="flag">🇫🇷</span> Français</button>
          </div>
        </div>
      </div>

      <div class="content-area">

        <!-- Pestañas de Citas (reemplazan los 4 botones de colores) -->
        <div class="tabs-bar" id="tabsCitas">
          <button type="button" class="tab-btn" data-tab="ver" onclick="navCitas('ver')">
            <span class="lbl" data-k="tab_agenda">Agenda</span>
          </button>
          <button type="button" class="tab-btn" data-tab="calendario" onclick="navCitas('calendario')">
            <span class="lbl" data-k="tab_calendario">Calendario</span>
          </button>
          <button type="button" class="tab-btn" data-tab="solicitudes" onclick="navCitas('solicitudes')">
            <span class="lbl" data-k="tab_solicitudes">Solicitudes</span>
            <span id="badgeSolicitudesBtn" class="tab-badge" style="display:none;">0</span>
          </button>
          <button type="button" class="tab-btn tab-primary" data-tab="nuevo" onclick="navCitas('nuevo')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span class="lbl" data-k="tab_nueva">Nueva cita</span>
          </button>
        </div>

        <div id="seccionFormulario" class="card" style="display: none;">
          <h3 style="color: #2ecc71; margin-bottom: 15px;" data-i18n="agendar_nueva_cita">📝 Agendar Nueva Cita</h3>

          <label><strong data-i18n="paciente_label">Paciente</strong></label>
          <select id="pacienteSelect" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white;">
            <option value="" data-i18n="seleccione_paciente">Seleccione un paciente</option>
          </select>
          <label><strong data-i18n="medico_label">Médico (opcional)</strong></label>
          <select id="medicoSelect" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white;">
            <option value="" data-i18n="sin_medico_asignar">Sin asignar</option>
          </select>
          <label><strong data-i18n="fecha_label">Fecha</strong></label>
          <div style="display:flex; gap:8px; margin-bottom:15px;">
            <select id="fechaDia" style="flex:1; padding:10px; border-radius:8px; background:#1a1a1a; color:white; border:1px solid #333;"></select>
            <select id="fechaMes" style="flex:2; padding:10px; border-radius:8px; background:#1a1a1a; color:white; border:1px solid #333;"></select>
            <select id="fechaAnio" style="flex:1; padding:10px; border-radius:8px; background:#1a1a1a; color:white; border:1px solid #333;"></select>
          </div>
          <input type="hidden" id="fecha">
          <div id="panelResumenDia" style="margin-bottom:15px;"></div>

          <label><strong data-i18n="hora_label">Hora</strong></label>
          <div style="background:#1a1a1a; border:1px solid #333; border-radius:10px; padding:16px; margin-bottom:8px;">
            <div id="horaSliderValor" style="font-size:22px; font-weight:bold; color:#93c5fd; text-align:center; margin-bottom:12px;">--:--</div>
            <input type="range" id="horaSlider" min="0" max="1435" step="5" style="width:100%;">
          </div>
          <div id="horaSliderAviso" style="font-size:12px; color:#f59e0b; margin-bottom:15px; min-height:16px;"></div>
          <input type="hidden" id="hora">

          <label style="margin-top:14px; display:block;"><strong data-i18n="hora_fin_label">Hora de fin (aproximada)</strong></label>
          <div style="background:#1a1a1a; border:1px solid #333; border-radius:10px; padding:16px; margin-bottom:8px;">
            <div id="horaFinSliderValor" style="font-size:22px; font-weight:bold; color:#93c5fd; text-align:center; margin-bottom:12px;">--:--</div>
            <input type="range" id="horaFinSlider" min="0" max="1435" step="5" style="width:100%;">
          </div>
          <div id="horaFinSliderAviso" style="font-size:12px; color:#f59e0b; margin-bottom:15px; min-height:16px;"></div>
          <input type="hidden" id="horaFin">

          <label><strong data-i18n="motivo_label">Razón de la cita</strong></label>
          <textarea id="motivo" data-i18n-placeholder="motivo_placeholder" placeholder="Ej. Consulta de rutina, dolor de cabeza, seguimiento..." style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #333; height: 90px; resize: vertical;"></textarea>

          <!-- Cobros: plan Profesional en adelante (los campos siguen en el DOM, solo se ocultan) -->
          <div data-requiere="cobros">
            <label><strong data-i18n="tipo_pago_label">Tipo de pago</strong></label>
            <select id="tipoPago" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #333;">
              <option value="particular" data-i18n="tipo_pago_particular">Particular</option>
              <option value="seguro" data-i18n="tipo_pago_seguro">Seguro</option>
            </select>
          </div>

          <div id="wrapperMonto" data-requiere="cobros">
            <label><strong data-i18n="monto_label">Monto (opcional)</strong></label>
            <input type="number" id="monto" step="0.01" min="0" placeholder="0.00" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #333;">
          </div>

          <label data-requiere="cobros" style="display:flex; align-items:center; gap:8px; margin-bottom:15px; cursor:pointer;">
            <input type="checkbox" id="cobrado" style="width:18px; height:18px;">
            <span data-i18n="ya_cobrado_label">¿Ya se cobró?</span>
          </label>

          <button type="button" onclick="agregarCita()" style="background-color: #2ecc71; width: 100%; margin-top: 10px;" data-i18n="confirmar_agendar">Confirmar y Agendar</button>
        </div>

        <div id="seccionLista" style="display: none;">

          <div class="ag-resumen" id="agResumen"></div>

          <div class="ag-toolbar">
            <div class="ag-tabs" id="agTabs">
              <button type="button" class="ag-tab active" data-vista="proximas" onclick="cambiarVistaAgenda('proximas')">
                <span data-k="ag_proximas">Próximas</span> <span class="ag-count" id="agCountProximas">0</span>
              </button>
              <button type="button" class="ag-tab" data-vista="anteriores" onclick="cambiarVistaAgenda('anteriores')">
                <span data-k="ag_anteriores">Anteriores</span> <span class="ag-count" id="agCountAnteriores">0</span>
              </button>
              <button type="button" class="ag-tab" data-vista="canceladas" onclick="cambiarVistaAgenda('canceladas')">
                <span data-k="ag_canceladas">Canceladas</span> <span class="ag-count" id="agCountCanceladas">0</span>
              </button>
            </div>
            <div class="ag-filters">
              <input type="search" id="agBuscar" class="ag-search" placeholder="Buscar paciente o motivo..." data-kph="ag_buscar" oninput="pintarAgenda()" autocomplete="off">
              <!-- Filtro por médico: plan Equipo en adelante -->
              <select id="filtroMedicoAgenda" data-requiere="por_medico" class="ag-select" onchange="pintarAgenda()">
                <option value="" data-i18n="filtro_todos_medicos">Todos los médicos</option>
              </select>
            </div>
          </div>

          <div id="listaCitas" class="ag-list"></div>
        </div>

        <div id="seccionCalendario" style="display: none;">
          <div class="calendar-toolbar">
            <button type="button" class="calendar-nav-btn" onclick="mesAnterior()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div id="calendarMesLabel" class="calendar-mes-label"></div>
            <button type="button" class="calendar-nav-btn" onclick="mesSiguiente()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button type="button" class="calendar-today-btn" onclick="irHoyCalendario()" data-i18n="hoy">Hoy</button>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>

          <div id="calendarDetallePanel" class="calendar-detalle-panel"></div>
        </div>

        <div id="seccionSolicitudes" style="display: none;">
          <h2 style="color: #f59e0b; margin-bottom: 15px;" data-i18n="solicitudes_pendientes_titulo">📥 Solicitudes Pendientes</h2>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;" data-i18n="solicitudes_pendientes_desc">
            Estas citas fueron pedidas por pacientes desde el link público. No están agendadas todavía — apruébalas o recházalas.
          </p>
          <div id="listaSolicitudes"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="./js/session.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/auditoria.js"></script>
  <script src="./js/citas.js"></script>
  <script>
    /* Resalta la pestaña activa de Citas */
    function marcarTabsCitas(modo) {
        document.querySelectorAll('#tabsCitas .tab-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === modo);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang") || "es";
        if(typeof changeLanguage === 'function') {
            changeLanguage(savedLang);
        }
        if(typeof revelarContenido === 'function') revelarContenido();

        // Si citas.js cambia de vista por su cuenta (ej. al guardar una cita), la pestaña la sigue
        if (typeof window.cambiarVista === 'function') {
            const original = window.cambiarVista;
            window.cambiarVista = function (modo) {
                const r = original.apply(this, arguments);
                marcarTabsCitas(modo);
                return r;
            };
        }
        marcarTabsCitas(new URLSearchParams(window.location.search).get('mode') || 'ver');
    });
  </script>
</body>
</html>
