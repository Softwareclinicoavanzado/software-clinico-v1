<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ClinicOS | Citas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <span class="sidebar-brand-name">ClinicOS</span>
      </div>

      <ul class="sidebar-nav">
        <li>
          <button class="sidebar-link" type="button" onclick="volver()" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5Z"/></svg>
            <span data-i18n="menu_dashboard">Dashboard</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irPacientes('ver')" data-nav="pacientes-ver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span data-i18n="ver_pacientes_link">Ver Pacientes</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irPacientes('nuevo')" data-nav="pacientes-nuevo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
            <span data-i18n="agregar_paciente_link">Agregar Paciente</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="cambiarVista('ver'); history.replaceState(null,'','citas.html?mode=ver'); if(typeof marcarLinkActivoPorURL==='function') marcarLinkActivoPorURL();" data-nav="citas-ver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span data-i18n="ver_agenda_link">Ver Agenda</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="cambiarVista('calendario'); history.replaceState(null,'','citas.html?mode=calendario'); if(typeof marcarLinkActivoPorURL==='function') marcarLinkActivoPorURL();" data-nav="citas-calendario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="8" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/></svg>
            <span data-i18n="calendario_btn">Calendario</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="cambiarVista('nuevo'); history.replaceState(null,'','citas.html?mode=nuevo'); if(typeof marcarLinkActivoPorURL==='function') marcarLinkActivoPorURL();" data-nav="citas-nuevo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>
            <span data-i18n="agendar_cita_link">Agendar Cita</span>
          </button>
        </li>
        <li id="liUsuarios" style="display:none;">
          <button class="sidebar-link" type="button" onclick="irUsuarios()" data-nav="usuarios">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="gestionar_usuarios_link">Gestionar Usuarios</span>
          </button>
        </li>
        <li id="liAuditoria" style="display:none;">
          <button class="sidebar-link" type="button" onclick="window.location.href='auditoria.html'" data-nav="auditoria">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span data-i18n="auditoria_link">Auditoría</span>
          </button>
        </li>
        <li id="liConfigCorreo" style="display:none;">
          <button class="sidebar-link" type="button" onclick="window.location.href='configuracion-correo.html'" data-nav="config-correo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <span data-i18n="config_correo_link">Recordatorios por Correo</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-divider"></div>
      <button class="sidebar-link danger-link" type="button" onclick="logout()" id="btnLogout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span data-i18n="cerrar_sesion">Cerrar sesión</span>
      </button>
    </aside>

    <div class="main-area">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:14px;">
          <button class="hamburger-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title">
            <span id="tituloPagina" data-i18n="gestion_citas">Gestión de Citas</span>
          </div>
        </div>

        <div class="lang-switcher">
          <button class="lang-btn" type="button" id="langMainBtn" onclick="toggleLangDropdown()">
            <span class="lang-flag-current" id="langFlagActual">🇲🇽</span>
            <span id="langBtnTexto">ES</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="es" onclick="seleccionarIdioma('es')"><span class="flag">🇲🇽</span> Español</button>
            <button class="lang-option" data-lang="en" onclick="seleccionarIdioma('en')"><span class="flag">🇺🇸</span> English</button>
            <button class="lang-option" data-lang="fr" onclick="seleccionarIdioma('fr')"><span class="flag">🇫🇷</span> Français</button>
          </div>
        </div>
      </div>

      <div class="content-area">

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button type="button" onclick="cambiarVista('ver'); history.replaceState(null,'','citas.html?mode=ver'); if(typeof marcarLinkActivoPorURL==='function') marcarLinkActivoPorURL();" style="background-color: #3498db; flex: 1;">
            <span data-i18n="ver_agenda">📅 Ver Agenda</span>
          </button>
          <button type="button" onclick="cambiarVista('calendario'); history.replaceState(null,'','citas.html?mode=calendario'); if(typeof marcarLinkActivoPorURL==='function') marcarLinkActivoPorURL();" style="background-color: #8b5cf6; flex: 1;">
            <span data-i18n="calendario_btn">🗓️ Calendario</span>
          </button>
          <button type="button" onclick="cambiarVista('nuevo'); history.replaceState(null,'','citas.html?mode=nuevo'); if(typeof marcarLinkActivoPorURL==='function') marcarLinkActivoPorURL();" style="background-color: #2ecc71; flex: 1;">
            <span data-i18n="nueva_cita">➕ Nueva Cita</span>
          </button>
        </div>

        <div id="seccionFormulario" class="card" style="display: none;">
          <h3 style="color: #2ecc71; margin-bottom: 15px;" data-i18n="agendar_nueva_cita">📝 Agendar Nueva Cita</h3>

          <label><strong data-i18n="paciente_label">Paciente</strong></label>
          <select id="pacienteSelect" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white;">
            <option value="" data-i18n="seleccione_paciente">Seleccione un paciente</option>
          </select>
          <label><strong data-i18n="fecha_label">Fecha</strong></label>
          <input type="date" id="fecha" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #333;">

          <label><strong data-i18n="hora_label">Hora</strong></label>
          <div class="time-picker-wrapper">
            <div class="time-picker-grid" id="timePickerGrid"></div>
            <div class="time-picker-custom">
              <span data-i18n="hora_personalizada">¿Otra hora?</span>
              <input type="time" id="horaCustom" onchange="seleccionarHoraCustom()">
            </div>
            <input type="hidden" id="hora">
          </div>

          <label><strong data-i18n="motivo_label">Razón de la cita</strong></label>
          <textarea id="motivo" data-i18n-placeholder="motivo_placeholder" placeholder="Ej. Consulta de rutina, dolor de cabeza, seguimiento..." style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1a1a; color: white; border: 1px solid #333; height: 90px; resize: vertical;"></textarea>
          <button type="button" onclick="agregarCita()" style="background-color: #2ecc71; width: 100%; margin-top: 10px;" data-i18n="confirmar_agendar">Confirmar y Agendar</button>
        </div>

        <div id="seccionLista" style="display: none;">
          <h2 style="color: #3498db; margin-bottom: 15px;" data-i18n="citas_programadas">📋 Citas Programadas</h2>
          <ul class="lista" id="listaCitas" style="padding: 0;"></ul>
        </div>

        <div id="seccionCalendario" style="display: none;">
          <div class="calendar-toolbar">
            <button type="button" class="calendar-nav-btn" onclick="mesAnterior()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div id="calendarMesLabel" class="calendar-mes-label"></div>
            <button type="button" class="calendar-nav-btn" onclick="mesSiguiente()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button type="button" class="calendar-today-btn" onclick="irHoyCalendario()" data-i18n="hoy">Hoy</button>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>

          <div id="calendarDetallePanel" class="calendar-detalle-panel"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="./js/session.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/auditoria.js"></script>
  <script src="./js/citas.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang") || "es";
        if(typeof changeLanguage === 'function') {
            changeLanguage(savedLang);
        }
        if(typeof revelarContenido === 'function') revelarContenido();
    });
  </script>
</body>
</html>
