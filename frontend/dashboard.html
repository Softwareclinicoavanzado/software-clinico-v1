<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ClinicOS | Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- El menú lo dibuja js/layout.js (igual en todas las páginas) -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-area">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:14px;">
          <button class="hamburger-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title">
            <span id="clinica">ClinicOS</span>
            <small id="usuarioInfo"></small>
          </div>
        </div>

        <div class="lang-switcher">
          <button class="lang-btn" type="button" id="langMainBtn" onclick="toggleLangDropdown()">
            <span class="lang-flag-current" id="langFlagActual">🇲🇽</span>
            <span id="langBtnTexto">ES</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="es" onclick="seleccionarIdioma('es')"><span class="flag">🇲🇽</span> Español</button>
            <button class="lang-option" data-lang="en" onclick="seleccionarIdioma('en')"><span class="flag">🇺🇸</span> English</button>
            <button class="lang-option" data-lang="fr" onclick="seleccionarIdioma('fr')"><span class="flag">🇫🇷</span> Français</button>
          </div>
        </div>
      </div>

      <div class="content-area">
        <div class="stats" id="statsContainer">
          <div class="stat-card">
            <h2 id="totalPacientes">0</h2>
            <p data-i18n="pacientes_registrados">Pacientes Registrados</p>
          </div>
          <div class="stat-card">
            <h2 id="pacientesNuevosMes">0</h2>
            <p data-i18n="stat_pacientes_nuevos">Nuevos este mes</p>
          </div>
          <div class="stat-card">
            <h2 id="citasHoy">0</h2>
            <p data-i18n="stat_citas_hoy">Citas Hoy</p>
          </div>
          <div class="stat-card">
            <h2 id="citasSemana">0</h2>
            <p data-i18n="stat_citas_semana">Próximos 7 días</p>
          </div>
        </div>

        <!-- Atajos: solo las acciones de crear. Navegar está en el menú. -->
        <div class="action-grid">
          <button class="action-card" onclick="irCitas('nuevo')">
            <div class="action-icon" style="background:#f59e0b;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>
            </div>
            <span data-i18n="agendar_cita_link">Agendar Cita</span>
          </button>
          <button class="action-card" onclick="irPacientes('nuevo')">
            <div class="action-icon" style="background:#16a34a;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
            </div>
            <span data-i18n="agregar_paciente_link">Agregar Paciente</span>
          </button>
          <button class="action-card" id="cardUsuarios" onclick="irUsuarios()" style="display:none;">
            <div class="action-icon" style="background:#8b5cf6;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span data-i18n="gestionar_usuarios_link">Gestionar Usuarios</span>
          </button>
          <button class="action-card" id="cardAuditoria" data-requiere="auditoria" onclick="window.location.href='auditoria.html'" style="display:none;">
            <div class="action-icon" style="background:#0891b2;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <span data-i18n="auditoria_link">Auditoría</span>
          </button>
        </div>

        <!-- Aviso discreto de WhatsApp pendiente (solo aparece si hay citas de mañana sin enviar) -->
        <div class="card" id="whatsappPendienteWidget" style="display:none; margin-top:20px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.3);">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:20px;">⚠️</span>
              <span id="whatsappPendienteTexto" style="font-size:14px; color:#fbbf24; font-weight:600;"></span>
            </div>
            <button type="button" class="secondary" onclick="irCitas('ver')" style="white-space:nowrap;">
              📲 Ver agenda
            </button>
          </div>
        </div>

        <!-- Tasa de asistencia del mes (plan Profesional en adelante) -->
        <div class="card" id="asistenciaWidget" data-requiere="asistencia" style="display:none; margin-top:20px;">
          <h3 style="color:#93c5fd; margin-bottom:14px; font-size:15px;" data-i18n="asistencia_titulo">📊 Asistencia este mes</h3>
          <div style="display:flex; gap:20px; flex-wrap:wrap;">
            <div>
              <div id="asistenciaTasa" style="font-size:28px; font-weight:bold; color:#22c55e;">--%</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="asistencia_tasa_label">Tasa de asistencia</div>
            </div>
            <div>
              <div id="asistenciaNoShows" style="font-size:28px; font-weight:bold; color:#ef4444;">--</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="asistencia_noshows_label">No-shows</div>
            </div>
            <div>
              <div id="asistenciaSinMarcar" style="font-size:28px; font-weight:bold; color:#94a3b8;">--</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="asistencia_sinmarcar_label">Sin marcar todavía</div>
            </div>
          </div>
        </div>

        <!-- Resumen de cobros del mes (plan Profesional en adelante) -->
        <div class="card" id="cobrosWidget" data-requiere="cobros" style="display:none; margin-top:20px;">
          <h3 style="color:#93c5fd; margin-bottom:14px; font-size:15px;" data-i18n="cobros_titulo">💰 Cobros este mes</h3>
          <div style="display:flex; gap:20px; flex-wrap:wrap;">
            <div>
              <div id="cobrosCobrado" style="font-size:24px; font-weight:bold; color:#22c55e;">Q0.00</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="cobros_cobrado_label">Cobrado</div>
            </div>
            <div>
              <div id="cobrosPendiente" style="font-size:24px; font-weight:bold; color:#f59e0b;">Q0.00</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="cobros_pendiente_label">Pendiente de cobro</div>
            </div>
            <div>
              <div id="cobrosCantidadPendiente" style="font-size:24px; font-weight:bold; color:#94a3b8;">--</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="cobros_cantidad_pendiente_label">Citas sin cobrar</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="./js/storage.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/session.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang") || "es";
        if(typeof changeLanguage === 'function') changeLanguage(savedLang);
        if(typeof revelarContenido === 'function') revelarContenido();
    });
  </script>
</body>
</html>
