<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ClinicOS | Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <span class="sidebar-brand-name">ClinicOS</span>
      </div>

      <ul class="sidebar-nav">
        <li>
          <button class="sidebar-link" type="button" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5Z"/></svg>
            <span data-i18n="menu_dashboard">Dashboard</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irPacientes('ver')" data-nav="pacientes-ver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span data-i18n="ver_pacientes_link">Ver Pacientes</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irPacientes('nuevo')" data-nav="pacientes-nuevo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
            <span data-i18n="agregar_paciente_link">Agregar Paciente</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irCitas('ver')" data-nav="citas-ver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span data-i18n="ver_agenda_link">Ver Agenda</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irCitas('calendario')" data-nav="citas-calendario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="8" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/></svg>
            <span data-i18n="calendario_btn">Calendario</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irCitas('nuevo')" data-nav="citas-nuevo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>
            <span data-i18n="agendar_cita_link">Agendar Cita</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="window.location.href='citas.html?mode=solicitudes'" data-nav="citas-solicitudes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
            <span data-i18n="solicitudes_link">Solicitudes</span>
            <span id="badgeSolicitudesDashboard" style="display:none; background:#f59e0b; color:#1e1409; font-size:11px; font-weight:bold; border-radius:999px; padding:1px 7px; margin-left:6px;">0</span>
          </button>
        </li>
        <li id="liUsuarios" style="display:none;">
          <button class="sidebar-link" type="button" onclick="irUsuarios()" data-nav="usuarios">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="gestionar_usuarios_link">Gestionar Usuarios</span>
          </button>
        </li>
        <li id="liAuditoria" style="display:none;">
          <button class="sidebar-link" type="button" onclick="window.location.href='auditoria.html'" data-nav="auditoria">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span data-i18n="auditoria_link">Auditoría</span>
          </button>
        </li>
        <li id="liConfigCorreo" style="display:none;">
          <button class="sidebar-link" type="button" onclick="window.location.href='configuracion-correo.html'" data-nav="config-correo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <span data-i18n="config_correo_link">Recordatorios por Correo</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-divider"></div>
      <button class="sidebar-link danger-link" type="button" onclick="logout()" id="btnLogout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span data-i18n="cerrar_sesion">Cerrar sesión</span>
      </button>
    </aside>

    <div class="main-area">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:14px;">
          <button class="hamburger-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title">
            <span id="clinica">ClinicOS</span>
            <small id="usuarioInfo"></small>
          </div>
        </div>

        <div class="lang-switcher">
          <button class="lang-btn" type="button" id="langMainBtn" onclick="toggleLangDropdown()">
            <span class="lang-flag-current" id="langFlagActual">🇲🇽</span>
            <span id="langBtnTexto">ES</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="es" onclick="seleccionarIdioma('es')"><span class="flag">🇲🇽</span> Español</button>
            <button class="lang-option" data-lang="en" onclick="seleccionarIdioma('en')"><span class="flag">🇺🇸</span> English</button>
            <button class="lang-option" data-lang="fr" onclick="seleccionarIdioma('fr')"><span class="flag">🇫🇷</span> Français</button>
          </div>
        </div>
      </div>

      <div class="content-area">
        <div class="stats" id="statsContainer">
          <div class="stat-card">
            <h2 id="totalPacientes">0</h2>
            <p data-i18n="pacientes_registrados">Pacientes Registrados</p>
          </div>
          <div class="stat-card">
            <h2 id="pacientesNuevosMes">0</h2>
            <p data-i18n="stat_pacientes_nuevos">Nuevos este mes</p>
          </div>
          <div class="stat-card">
            <h2 id="citasHoy">0</h2>
            <p data-i18n="stat_citas_hoy">Citas Hoy</p>
          </div>
          <div class="stat-card">
            <h2 id="citasSemana">0</h2>
            <p data-i18n="stat_citas_semana">Próximos 7 días</p>
          </div>
        </div>

        <div class="action-grid">
          <button class="action-card" onclick="irPacientes('ver')">
            <div class="action-icon" style="background:#334155;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            </div>
            <span data-i18n="ver_pacientes_link">Ver Pacientes</span>
          </button>
          <button class="action-card" onclick="irPacientes('nuevo')">
            <div class="action-icon" style="background:#16a34a;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
            </div>
            <span data-i18n="agregar_paciente_link">Agregar Paciente</span>
          </button>
          <button class="action-card" onclick="irCitas('ver')">
            <div class="action-icon" style="background:#2563eb;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </div>
            <span data-i18n="ver_agenda_link">Ver Agenda</span>
          </button>
          <button class="action-card" onclick="irCitas('calendario')">
            <div class="action-icon" style="background:#8b5cf6;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="8" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/></svg>
            </div>
            <span data-i18n="calendario_btn">Calendario</span>
          </button>
          <button class="action-card" onclick="irCitas('nuevo')">
            <div class="action-icon" style="background:#f59e0b;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>
            </div>
            <span data-i18n="agendar_cita_link">Agendar Cita</span>
          </button>
          <button class="action-card" id="cardUsuarios" onclick="irUsuarios()" style="display:none;">
            <div class="action-icon" style="background:#8b5cf6;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span data-i18n="gestionar_usuarios_link">Gestionar Usuarios</span>
          </button>
          <button class="action-card" id="cardAuditoria" onclick="window.location.href='auditoria.html'" style="display:none;">
            <div class="action-icon" style="background:#0891b2;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <span data-i18n="auditoria_link">Auditoría</span>
          </button>
        </div>

        <!-- Aviso discreto de WhatsApp pendiente (solo aparece si hay citas de mañana sin enviar) -->
        <div class="card" id="whatsappPendienteWidget" style="display:none; margin-top:20px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.3);">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:20px;">⚠️</span>
              <span id="whatsappPendienteTexto" style="font-size:14px; color:#fbbf24; font-weight:600;"></span>
            </div>
            <button type="button" class="secondary" onclick="irCitas('ver')" style="white-space:nowrap;">
              📲 Ver agenda
            </button>
          </div>
        </div>

        <!-- Tasa de asistencia del mes -->
        <div class="card" id="asistenciaWidget" style="display:none; margin-top:20px;">
          <h3 style="color:#93c5fd; margin-bottom:14px; font-size:15px;" data-i18n="asistencia_titulo">📊 Asistencia este mes</h3>
          <div style="display:flex; gap:20px; flex-wrap:wrap;">
            <div>
              <div id="asistenciaTasa" style="font-size:28px; font-weight:bold; color:#22c55e;">--%</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="asistencia_tasa_label">Tasa de asistencia</div>
            </div>
            <div>
              <div id="asistenciaNoShows" style="font-size:28px; font-weight:bold; color:#ef4444;">--</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="asistencia_noshows_label">No-shows</div>
            </div>
            <div>
              <div id="asistenciaSinMarcar" style="font-size:28px; font-weight:bold; color:#94a3b8;">--</div>
              <div style="font-size:12px; color:var(--text-muted);" data-i18n="asistencia_sinmarcar_label">Sin marcar todavía</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="./js/storage.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/session.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang") || "es";
        if(typeof changeLanguage === 'function') changeLanguage(savedLang);
        if(typeof revelarContenido === 'function') revelarContenido();
    });
  </script>
</body>
</html>
