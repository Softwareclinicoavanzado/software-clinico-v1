<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ClinicOS | Usuarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-shell">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <span class="sidebar-brand-name">ClinicOS</span>
      </div>

      <ul class="sidebar-nav">
        <li>
          <button class="sidebar-link" type="button" onclick="volver()" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5Z"/></svg>
            <span data-i18n="menu_dashboard">Dashboard</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irPacientes('ver')" data-nav="pacientes-ver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span data-i18n="ver_pacientes_link">Ver Pacientes</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irPacientes('nuevo')" data-nav="pacientes-nuevo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
            <span data-i18n="agregar_paciente_link">Agregar Paciente</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irCitas('ver')" data-nav="citas-ver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span data-i18n="ver_agenda_link">Ver Agenda</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irCitas('calendario')" data-nav="citas-calendario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="8" cy="15" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/></svg>
            <span data-i18n="calendario_btn">Calendario</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" onclick="irCitas('nuevo')" data-nav="citas-nuevo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v6M9 17h6"/></svg>
            <span data-i18n="agendar_cita_link">Agendar Cita</span>
          </button>
        </li>
        <li id="liUsuarios">
          <button class="sidebar-link" type="button" onclick="irUsuarios()" data-nav="usuarios">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="gestionar_usuarios_link">Gestionar Usuarios</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-divider"></div>
      <button class="sidebar-link danger-link" type="button" onclick="logout()" id="btnLogout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span data-i18n="cerrar_sesion">Cerrar sesión</span>
      </button>
    </aside>

    <div class="main-area">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:14px;">
          <button class="hamburger-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title">
            <span id="tituloPagina" data-i18n="gestion_usuarios">Gestión de Usuarios</span>
          </div>
        </div>

        <div class="lang-switcher">
          <button class="lang-btn" type="button" id="langMainBtn" onclick="toggleLangDropdown()">
            <span class="lang-flag-current" id="langFlagActual">🇲🇽</span>
            <span id="langBtnTexto">ES</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="es" onclick="seleccionarIdioma('es')"><span class="flag">🇲🇽</span> Español</button>
            <button class="lang-option" data-lang="en" onclick="seleccionarIdioma('en')"><span class="flag">🇺🇸</span> English</button>
            <button class="lang-option" data-lang="fr" onclick="seleccionarIdioma('fr')"><span class="flag">🇫🇷</span> Français</button>
          </div>
        </div>
      </div>

      <div class="content-area">

        <div class="card" id="seccionFormulario">
          <h3 style="color: #2ecc71; margin-bottom: 15px;" data-i18n="agregar_personal">➕ Agregar Personal</h3>
          <div class="form-grid">
            <input type="text" id="nombre" data-i18n-placeholder="nombre_completo_ph" placeholder="Nombre completo">
            <input type="email" id="email" data-i18n-placeholder="correo_electronico" placeholder="Correo electrónico" autocomplete="off">
            <input type="password" id="password" data-i18n-placeholder="contrasena_temporal" placeholder="Contraseña temporal" autocomplete="new-password">
            <select id="rol">
              <option value="doctor" data-i18n="rol_doctor">Doctor</option>
              <option value="recepcion" data-i18n="rol_recepcion">Recepción</option>
              <option value="admin" data-i18n="rol_admin">Administrador</option>
            </select>
            <button type="button" class="btn-primary" onclick="crearUsuario()" data-i18n="crear_cuenta">
              🚀 Crear Cuenta
            </button>
          </div>
        </div>

        <div id="seccionLista">
          <h2 style="color: #3498db; margin: 20px 0 15px;" data-i18n="personal_clinica">📋 Personal de la Clínica</h2>
          <ul class="lista" id="listaUsuarios" style="padding: 0;"></ul>
        </div>

      </div>
    </div>
  </div>

  <script src="./js/storage.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/session.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/usuarios.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem("lang") || "es";
        if (typeof changeLanguage === 'function') {
            changeLanguage(savedLang);
        }
        if(typeof revelarContenido === 'function') revelarContenido();
    });
  </script>
</body>
</html>
