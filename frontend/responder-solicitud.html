<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicOS | Responder solicitud</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: white;
    border-radius: 16px;
    padding: 28px 28px 32px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .icono { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 20px; color: #1e293b; margin: 0 0 12px; }
  p { font-size: 14px; color: #64748b; margin: 0; line-height: 1.5; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: #3b82f6;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  .btn-accion-prompt {
    display: inline-block;
    margin-top: 18px;
    background: #3b82f6;
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    padding: 12px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="contenido">
      <div class="spinner"></div>
      <h1 id="tituloTexto">Procesando...</h1>
      <p id="mensajeTexto">Un momento por favor.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://klaygjvawybfksmahbhd.supabase.co";

    const TXT = {
      es: {
        procesando_titulo: "Procesando...",
        procesando_mensaje: "Un momento por favor.",
        prompt_aprobar_titulo: "¿Aprobar esta solicitud?",
        prompt_aprobar_mensaje: "La cita quedará agendada y se le avisará al paciente por correo.",
        prompt_aprobar_btn: "✅ Sí, aprobar solicitud",
        prompt_reprogramar_titulo: "¿Pedirle al paciente otro horario?",
        prompt_reprogramar_mensaje: "Se le avisará por correo para que elija un horario distinto desde el link público.",
        prompt_reprogramar_btn: "🔄 Sí, pedir otro horario",
        invalido_titulo: "Enlace inválido",
        invalido_mensaje: "Este enlace no es válido o ya fue utilizado.",
        aprobada_titulo: "✅ Solicitud aprobada",
        aprobada_mensaje: "La cita quedó agendada. Se le avisó al paciente por correo.",
        reprogramar_titulo: "🔄 Se pidió reprogramar",
        reprogramar_mensaje: "Se avisó al paciente por correo para que elija otro horario.",
        ya_procesada_titulo: "Esta solicitud ya fue procesada",
        ya_procesada_mensaje: "Alguien más ya respondió esta solicitud anteriormente.",
        no_encontrada_titulo: "Solicitud no encontrada",
        no_encontrada_mensaje: "No pudimos encontrar esta solicitud.",
        error_titulo: "Error inesperado",
        error_mensaje: "Ocurrió un error. Intenta desde el software directamente.",
      },
      en: {
        procesando_titulo: "Processing...",
        procesando_mensaje: "One moment please.",
        prompt_aprobar_titulo: "Approve this request?",
        prompt_aprobar_mensaje: "The appointment will be scheduled and the patient will be notified by email.",
        prompt_aprobar_btn: "✅ Yes, approve request",
        prompt_reprogramar_titulo: "Ask the patient for another time?",
        prompt_reprogramar_mensaje: "They'll be notified by email to choose a different time from the public link.",
        prompt_reprogramar_btn: "🔄 Yes, ask for another time",
        invalido_titulo: "Invalid link",
        invalido_mensaje: "This link isn't valid or was already used.",
        aprobada_titulo: "✅ Request approved",
        aprobada_mensaje: "The appointment is scheduled. The patient was notified by email.",
        reprogramar_titulo: "🔄 Reschedule requested",
        reprogramar_mensaje: "The patient was notified by email to choose another time.",
        ya_procesada_titulo: "This request was already processed",
        ya_procesada_mensaje: "Someone else already responded to this request.",
        no_encontrada_titulo: "Request not found",
        no_encontrada_mensaje: "We couldn't find this request.",
        error_titulo: "Unexpected error",
        error_mensaje: "Something went wrong. Try from the software directly.",
      },
      fr: {
        procesando_titulo: "Traitement en cours...",
        procesando_mensaje: "Un instant s'il vous plaît.",
        prompt_aprobar_titulo: "Approuver cette demande ?",
        prompt_aprobar_mensaje: "Le rendez-vous sera planifié et le patient sera informé par e-mail.",
        prompt_aprobar_btn: "✅ Oui, approuver la demande",
        prompt_reprogramar_titulo: "Demander un autre horaire au patient ?",
        prompt_reprogramar_mensaje: "Il sera informé par e-mail pour choisir un horaire différent depuis le lien public.",
        prompt_reprogramar_btn: "🔄 Oui, demander un autre horaire",
        invalido_titulo: "Lien invalide",
        invalido_mensaje: "Ce lien n'est pas valide ou a déjà été utilisé.",
        aprobada_titulo: "✅ Demande approuvée",
        aprobada_mensaje: "Le rendez-vous est planifié. Le patient a été informé par e-mail.",
        reprogramar_titulo: "🔄 Reprogrammation demandée",
        reprogramar_mensaje: "Le patient a été informé par e-mail pour choisir un autre horaire.",
        ya_procesada_titulo: "Cette demande a déjà été traitée",
        ya_procesada_mensaje: "Quelqu'un d'autre a déjà répondu à cette demande.",
        no_encontrada_titulo: "Demande introuvable",
        no_encontrada_mensaje: "Nous n'avons pas pu trouver cette demande.",
        error_titulo: "Erreur inattendue",
        error_mensaje: "Une erreur s'est produite. Réessayez depuis le logiciel.",
      },
    };

    function idiomaValido(l) {
      return ["es", "en", "fr"].includes(l) ? l : "es";
    }

    let idioma = "es";
    let accionPendiente = null; // { id, accion, token }

    function pintarPrompt() {
      const tx = TXT[idioma];
      const contenido = document.getElementById("contenido");
      const clave = accionPendiente.accion === "reprogramar" ? "prompt_reprogramar" : "prompt_aprobar";
      const icono = accionPendiente.accion === "reprogramar" ? "🔄" : "✅";
      contenido.innerHTML = `
        <div class="icono">${icono}</div>
        <h1>${tx[`${clave}_titulo`]}</h1>
        <p>${tx[`${clave}_mensaje`]}</p>
        <button type="button" class="btn-accion-prompt" onclick="ejecutarAccion()">${tx[`${clave}_btn`]}</button>
      `;
    }

    function pintarResultado(codigo) {
      const tx = TXT[idioma];
      const contenido = document.getElementById("contenido");
      const clave = tx[`${codigo}_titulo`] ? codigo : "error";
      const icono = codigo === "aprobada" ? "✅" : codigo === "reprogramar" ? "🔄" : "⚠️";
      contenido.innerHTML = `
        <div class="icono">${icono}</div>
        <h1>${tx[`${clave}_titulo`]}</h1>
        <p>${tx[`${clave}_mensaje`]}</p>
      `;
    }

    function pintarProcesando() {
      const tx = TXT[idioma];
      const contenido = document.getElementById("contenido");
      contenido.innerHTML = `
        <div class="spinner"></div>
        <h1>${tx.procesando_titulo}</h1>
        <p>${tx.procesando_mensaje}</p>
      `;
    }

    // Solo se llama cuando la secretaria hace clic en el botón del
    // prompt — antes de esto no se ha llamado a la función que
    // aprueba o reprograma la solicitud.
    async function ejecutarAccion() {
      if (!accionPendiente) return;
      pintarProcesando();

      try {
        const res = await fetch(
          `${SUPABASE_URL}/functions/v1/responder-solicitud?id=${encodeURIComponent(accionPendiente.id)}&accion=${encodeURIComponent(accionPendiente.accion)}&token=${encodeURIComponent(accionPendiente.token)}`
        );
        const data = await res.json();
        pintarResultado(data.codigo || "error");
      } catch (e) {
        pintarResultado("error");
      }
    }

    function procesar() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const accion = params.get("accion");
      const token = params.get("token");
      idioma = idiomaValido(params.get("lang") || "es");

      if (!id || !accion || !token || !["aprobar", "reprogramar"].includes(accion)) {
        // Nada que confirmar: esto es solo lectura, no dispara ningún
        // cambio, así que sí es seguro mostrarlo de inmediato.
        pintarResultado("invalido");
        return;
      }

      accionPendiente = { id, accion, token };
      pintarPrompt();
    }

    procesar();
  </script>
</body>
</html>
