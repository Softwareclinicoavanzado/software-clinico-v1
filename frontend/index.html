<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClinicOS | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="languageSelector" class="lang-select-overlay">
        <div class="lang-select-brand">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/><path d="M9 12l2 2 4-4"/></svg>
            </div>
            <h1>ClinicOS</h1>
        </div>
        <p class="lang-select-subtitle">Select your language / Selecciona tu idioma / Choisissez votre langue</p>
        <div class="lang-select-options">
            <button class="lang-select-btn" onclick="selectLanguage('es')">
                <div class="flag-circle">🇲🇽</div>
                <div>
                    <div>Español</div>
                    <div class="lang-code">MX</div>
                </div>
            </button>
            <button class="lang-select-btn" onclick="selectLanguage('en')">
                <div class="flag-circle">🇺🇸</div>
                <div>
                    <div>English</div>
                    <div class="lang-code">US</div>
                </div>
            </button>
            <button class="lang-select-btn" onclick="selectLanguage('fr')">
                <div class="flag-circle">🇫🇷</div>
                <div>
                    <div>Français</div>
                    <div class="lang-code">FR</div>
                </div>
            </button>
        </div>
    </div>
    <div class="login-card" style="display: none;" id="loginSection">
        <h1>ClinicOS</h1>
        <p id="mensaje" class="subtitulo" data-i18n="bienvenida">Bienvenido de nuevo</p>
        <div class="form-group">
            <input id="usuario" type="email" placeholder="Correo electrónico" data-i18n-placeholder="usuario" autocomplete="username">
            <input id="password" type="password" placeholder="Contraseña" data-i18n-placeholder="password" autocomplete="current-password">
        </div>
        <button id="loginBtn" type="button" data-i18n="ingresar">Ingresar</button>
        <p id="error"></p>
        <button type="button" class="secondary" onclick="showLangSelector()" style="margin-top:15px; font-size:0.85rem;">🌐 Change Language</button>
    </div>
    <script src="./js/storage.js"></script>
    <script src="./js/translations.js"></script>
    <script src="./js/auth.js"></script>
    <script>
        function selectLanguage(lang) {
            localStorage.setItem("lang", lang);
            document.getElementById("languageSelector").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("languageSelector").style.display = "none";
                document.getElementById("loginSection").style.display = "block";
                if(typeof changeLanguage === 'function') changeLanguage(lang);
            }, 400);
        }
        function showLangSelector() {
            document.getElementById("languageSelector").style.display = "flex";
            document.getElementById("languageSelector").style.opacity = "1";
            document.getElementById("loginSection").style.display = "none";
        }
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById("languageSelector");
            if (overlay) overlay.classList.add("i18n-ready");
        });
    </script>
</body>
</html>
